window_margin_width         5
background_opacity          1
window_border_width         1pt
single_window_margin_width  0
enabled_layouts             splits:split_axis=auto

tab_powerline_style slanted
tab_bar_style       powerline
tab_separator       ""
tab_title_template  " {index} {title} "

sync_to_monitor no
repaint_delay 2
input_delay 0

# Allow clipboard read (terminal selection)
clipboard_control write-clipboard write-primary read-clipboard read-primary

mouse_map left click ungrabbed mouse_handle_click selection link prompt
mouse_map ctrl+left click ungrabbed mouse_select_command_output

# Open not-tall terminal downwards
map ctrl+shift+s launch --location=hsplit --bias=25

click_interval 0.2

editor nvim

map ctrl+shift+j layout_action rotate

map shift+up move_window up
map shift+left move_window left
map shift+right move_window right
map shift+down move_window down

map ctrl+left neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up neighboring_window up
map ctrl+down neighboring_window down

cursor_trail 1

# OS-specific settings. kitty sets KITTY_OS to linux, macos or bsd while
# processing includes. globinclude rather than include, so a system without a
# matching file stays quiet instead of logging a missing-file warning.
globinclude os/${KITTY_OS}.conf

# BEGIN_KITTY_THEME
# Adwaita darker
include current-theme.conf
# END_KITTY_THEME


# BEGIN_KITTY_FONTS
font_family      family="AtkynsonMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
