# Autostart
exec-once = dbus-update-activation-environment --systemd XDG_CURRENT_DESKTOP=Hyprland XDG_SESSION_TYPE=wayland
exec-once = systemctl --user import-environment XDG_CURRENT_DESKTOP XDG_SESSION_TYPE WAYLAND_DISPLAY DISPLAY
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = playerctld daemon
exec-once = hypridle
exec-once = waybar
exec-once = swaync
exec-once = swayosd-server
exec-once = /usr/lib/x86_64-linux-gnu/libexec/polkit-kde-authentication-agent-1
