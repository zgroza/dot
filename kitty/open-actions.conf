# include/globinclude are silently ignored in this file, so the OS difference
# is handled with an alias that picks whichever opener the system has. Both
# sh and the openers are in the default PATH, so this works from the GUI too.
action_alias desktop_open launch --type=background sh -c 'if command -v xdg-open > /dev/null 2>&1; then exec xdg-open "$1"; else exec open "$1"; fi' desktop_open

# Open any image in the full kitty window by clicking on it
protocol file
mime image/*
action launch --type=window kitten icat --hold -- ${FILE_PATH}

# Open directories
protocol file
mime inode/directory
action launch --type=window --cwd -- $FILE_PATH

# Hand media and documents to the desktop
protocol file
mime audio/*
action desktop_open ${FILE_PATH}

protocol file
mime video/*
action desktop_open ${FILE_PATH}

protocol file
mime application/*
action desktop_open ${FILE_PATH}

# Open files in Vim
protocol file
action launch --type=window nvim ${FILE_PATH}
