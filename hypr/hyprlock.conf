# Hyprlock Config
general {
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    # path = /home/zgroza/Pictures/wallpaper.jpg # Disabling image for now to troubleshoot crash
    color = rgba(0, 0, 0, 1.0)
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgb(151515)
    inner_color = rgb(200, 200, 200)
    font_color = rgb(10, 10, 10)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = $TIME
    color = rgba(200, 200, 200, 1.0)
    font_size = 64
    font_family = AtkynsonMono Nerd Font Bold
    position = 0, 80
    halign = center
    valign = center
}

# Battery
label {
    monitor =
    text = cmd[update:10000] echo "󰁹 $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1)%"
    color = rgba(200, 200, 200, 1.0)
    font_size = 18
    font_family = AtkynsonMono Nerd Font
    position = 0, 20
    halign = center
    valign = bottom
}
