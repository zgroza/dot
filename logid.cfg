// Credits to https://github.com/vjeko2404
// Reference: https://github.com/PixlOne/logiops/issues/520
//
//  Logitech MX Master 4 Buttons
//  0x0c4  → Top button behind scroll wheel
//  0x052  → Middle click (wheel press)
//  0x053  → Back button (side)
//  0x056  → Forward button (side)
//  0x0c3  → Gesture button (Gesture button)
//  0x1a0  → Thumb button (bottom-left corner)

devices: (
  {
    name: "MX Master 4";

    dpi: 2000;

    buttons: (
      {
        cid: 0xc3;
        action: {
          type: "Gestures";
          gestures: (
            // Hold + Move Up ──────────────── Fullscreen toggle
            {
              direction: "Up";
              mode: "OnRelease";
              action: {
                type: "Keypress";
                keys: [ "KEY_LEFTMETA", "KEY_LEFTSHIFT", "KEY_F" ];
              };
            },

            // Hold + Move Down ────────────── Float toggle
            {
              direction: "Down";
              mode: "OnRelease";
              action: {
                type: "Keypress";
                keys: [ "KEY_LEFTMETA", "KEY_F" ];
              };
            },

            // Hold + Move Left ────────────── Workspace to the left
            {
              direction: "Left";
              mode: "OnRelease";
              action: {
                type: "Keypress";
                keys: [ "KEY_LEFTMETA", "KEY_COMMA" ];
              };
            },

            // Hold + Move Right ───────────── Workspace to the right
            {
              direction: "Right";
              mode: "OnRelease";
              action: {
                type: "Keypress";
                keys: [ "KEY_LEFTMETA", "KEY_DOT" ];
              };
            },

            // Simple click (no movement) ──── Toggle waybar
            {
              direction: "None";
              mode: "OnRelease";
              action: {
                type: "Keypress";
                keys: [ "KEY_LEFTMETA", "KEY_O" ];
              };
            }
          );
        };
      },
      {
        cid: 0x1a0;
        action: {
          type: "Keypress";
          keys: [ "KEY_LEFTMETA", "KEY_SPACE" ];
        };
      }
    );
  }
);
