# Keybindings Configuration
binds {
    workspace_back_and_forth = true
}

# Keybindings
bind = $mainMod, Return, exec, $term
bind = $mainMod, Q, killactive
bind = $mainMod, Space, exec, $launcher
bind = ALT, Space, exec, $launcher
bind = $mainMod, P, exec, loginctl lock-session
bind = $mainMod, F, togglefloating
bind = $mainMod SHIFT, F, fullscreen
bind = $mainMod, V, togglesplit
bind = $mainMod SHIFT, V, togglegroup
bind = $mainMod, bracketleft, changegroupactive, b
bind = $mainMod, bracketright, changegroupactive, f
bind = $mainMod, A, changegroupactive, b
bind = $mainMod, D, changegroupactive, f
bind = ALT SHIFT, Tab, changegroupactive, b
bind = ALT, Tab, changegroupactive, f
bind = $mainMod, Tab, workspace, previous
bind = $mainMod SHIFT, Tab, cyclenext, prev

# Focus movement
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Right, movefocus, r
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Move focused container
bind = $mainMod SHIFT, Left, movewindoworgroup, l
bind = $mainMod SHIFT, Right, movewindoworgroup, r
bind = $mainMod SHIFT, Up, movewindoworgroup, u
bind = $mainMod SHIFT, Down, movewindoworgroup, d
bind = $mainMod SHIFT, H, movewindoworgroup, l
bind = $mainMod SHIFT, L, movewindoworgroup, r
bind = $mainMod SHIFT, K, movewindoworgroup, u
bind = $mainMod SHIFT, J, movewindoworgroup, d

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, E, workspace, 5
bind = $mainMod, F1, workspace, F1
bind = $mainMod, F2, workspace, F2
bind = $mainMod, F3, workspace, F3
bind = $mainMod, F4, workspace, F4
bind = $mainMod, W, workspace, 10
bind = $mainMod, Comma, workspace, e-1
bind = $mainMod, Period, workspace, e+1

# Move container to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, E, movetoworkspace, 5
bind = $mainMod SHIFT, F1, movetoworkspace, F1
bind = $mainMod SHIFT, F2, movetoworkspace, F2
bind = $mainMod SHIFT, F3, movetoworkspace, F3
bind = $mainMod SHIFT, F4, movetoworkspace, F4
bind = $mainMod SHIFT, W, movetoworkspace, 10

# Move workspace between monitors
bind = $mainMod ALT, Left, movecurrentworkspacetomonitor, l
bind = $mainMod ALT, Right, movecurrentworkspacetomonitor, r
bind = $mainMod ALT, Up, movecurrentworkspacetomonitor, u
bind = $mainMod ALT, Down, movecurrentworkspacetomonitor, d
bind = $mainMod ALT, h, movecurrentworkspacetomonitor, l
bind = $mainMod ALT, l, movecurrentworkspacetomonitor, r
bind = $mainMod ALT, k, movecurrentworkspacetomonitor, u
bind = $mainMod ALT, j, movecurrentworkspacetomonitor, d

# Screenshots
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy && wl-paste > /dev/shm/Screenshot-$(date +%F_%T).png
bind = $mainMod, S, exec, grimshot copy active

# Media keys
binde = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
binde = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindl = , XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle

# Brightness keys
binde = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
binde = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

# Playback keys
# Updated to use swayosd-client for the OSD pop-up
bindl = , XF86AudioPlay, exec, swayosd-client --playerctl play-pause
bindl = , XF86AudioNext, exec, swayosd-client --playerctl next
bindl = , XF86AudioPrev, exec, swayosd-client --playerctl previous

# Caps Lock
# Note: This is only needed if you aren't using the swayosd-libinput-backend
bindr = , Caps_Lock, exec, swayosd-client --caps-lock

# Waybar toggle
bind = $mainMod SHIFT, O, exec, killall -SIGUSR2 waybar
bind = $mainMod, O, exec, killall -SIGUSR1 waybar

# Notification Center
bind = $mainMod SHIFT, N, exec, swaync-client -t -sw

# Session management
bind = $mainMod SHIFT, Q, exit
bind = $mainMod SHIFT, C, exec, hyprctl reload

# Shortcuts disabled mode
bind = $mainMod SHIFT, X, submap, shortcuts_disabled
submap = shortcuts_disabled
bind = $mainMod SHIFT, X, submap, reset
bind = $mainMod SHIFT, F, fullscreen
submap = reset

# Mouse binds
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
