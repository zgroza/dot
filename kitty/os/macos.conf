# Left Option sends Alt, otherwise none of the M-… bindings from .tmux.conf
# (pane switching, M-1..9, M-=) ever reach tmux. Right Option is left alone so
# the macOS Unicode input still works there. Needs a kitty restart to take
# effect, a config reload is explicitly not supported for this one.
macos_option_as_alt left

hide_window_decorations titlebar-and-corners

# ctrl+left/right belong to Mission Control and never reach kitty, so window
# navigation gets cmd here. The ctrl+arrow maps above stay harmlessly unused.
map cmd+left  neighboring_window left
map cmd+right neighboring_window right
map cmd+up    neighboring_window up
map cmd+down  neighboring_window down

# Behave like the Linux build: no lingering app without windows.
macos_quit_when_last_window_closed yes
