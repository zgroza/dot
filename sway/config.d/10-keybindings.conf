# --- Keybindings ---
# Toggle control center
bindsym $mod+Shift+n exec swaync-client -t -sw

bindsym $mod+Shift+X mode "shortcuts_disabled"
# Mode where shortcuts are disabled
mode "shortcuts_disabled" {
    bindsym $mod+Shift+X mode "default"
    bindsym $mod+Shift+f fullscreen
}
# Application Launchers
bindsym $mod+Return exec $term
# Ensure swaylock is installed and configured
bindsym $mod+p exec loginctl lock-session
# Ensure rofi is installed
bindsym $mod+space exec $launcher
bindsym Alt+space exec $launcher

# Set up keybinds to open the window switcher.
bindsym $mod+Tab mode swtchr; exec swtchr
bindsym $mod+Shift+Tab mode swtchr; exec swtchr
mode swtchr bindsym Backspace mode default

# Window Management
bindsym $mod+q kill
bindsym $mod+f floating toggle
bindsym $mod+Shift+f fullscreen
bindsym $mod+v layout toggle split
bindsym $mod+Shift+v layout toggle split tabbed stacking
bindsym $mod+Shift+o exec killall -SIGUSR2 waybar
bindsym $mod+o exec killall -SIGUSR1 waybar

# Screenshot command (ensure grim, slurp, wl-copy, wl-paste are installed)
bindsym $mod+Shift+s exec 'grim -g "$(slurp)" - | wl-copy && wl-paste > /dev/shm/Screenshot-$(date +%F_%T).png'
bindsym $mod+s exec 'grimshot copy active'

# Move workspace to output
bindsym $mod+Alt+Left move workspace to output left
bindsym $mod+Alt+Right move workspace to output right
bindsym $mod+Alt+Up move workspace to output up
bindsym $mod+Alt+Down move workspace to output down

# Focus movement (Arrows)
bindsym $mod+Left focus left
bindsym $mod+Right focus right
bindsym $mod+Up focus up
bindsym $mod+Down focus down

# Move focused container (Arrows)
bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Right move right
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Down move down

# Focus movement (Vim)
bindsym $mod+h focus left
bindsym $mod+l focus right
bindsym $mod+k focus up
bindsym $mod+j focus down

# Move focused container (Vim)
bindsym $mod+Shift+h move left
bindsym $mod+Shift+l move right
bindsym $mod+Shift+k move up
bindsym $mod+Shift+j move down

# Switch workspaces
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+e workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+F1 workspace F1
bindsym $mod+F2 workspace F2
bindsym $mod+F3 workspace F3
bindsym $mod+F4 workspace F4

bindsym $mod+comma workspace prev
bindsym $mod+period workspace next

bindsym $mod+w workspace term
bindsym $mod+Shift+w move container to workspace term

# Move focused container to workspace
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+e move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+F1 move container to workspace F1
bindsym $mod+Shift+F2 move container to workspace F2
bindsym $mod+Shift+F3 move container to workspace F3
bindsym $mod+Shift+F4 move container to workspace F4

# Allow switching between workspaces with left and right swipes
bindgesture swipe:left workspace prev
bindgesture swipe:right workspace next
bindgesture swipe:4:left exec wtype -M alt -k Left -m alt
bindgesture swipe:4:right exec wtype -M alt -k Right -m alt
bindgesture swipe:up exec $launcher
bindgesture swipe:down exec $launcher
# Allow container movements by pinching them
bindgesture pinch:inward+up move up
bindgesture pinch:inward+down move down
bindgesture pinch:inward+left move left
bindgesture pinch:inward+right move right

# Move/resize windows with mouse
floating_modifier $mod normal

# # Media Keys (Volume) - These should work as-is (ensure wpctl is available)
# bindsym XF86AudioRaiseVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
# bindsym XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# bindsym XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# 
# # Media Keys (Brightness) - These should work as-is (ensure brightnessctl is available)
# bindsym XF86MonBrightnessUp exec brightnessctl set +5%
# bindsym XF86MonBrightnessDown exec brightnessctl set 5%-

bindsym XF86AudioPlay exec playerctl play-pause

bindsym XF86AudioRaiseVolume exec swayosd-client --output-volume raise
bindsym XF86AudioLowerVolume exec  swayosd-client --output-volume lower

bindsym XF86AudioMute exec swayosd-client --output-volume mute-toggle
bindsym XF86AudioMicMute exec swayosd-client --input-volume mute-toggle

bindsym XF86MonBrightnessUp exec swayosd-client --brightness raise
bindsym XF86MonBrightnessDown exec swayosd-client --brightness lower

bindsym --release Caps_Lock exec swayosd-client --caps-lock
